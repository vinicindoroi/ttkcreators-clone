    <style>
      :root { --pink:#ff2a56; --green:#00b562; --dark:#1a1a1a; --gray:#6b6b6b; --bg:#f5f5f7; --border:#e8e8e8; }
      * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
      body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--dark); min-height:100vh; }
      .wrap { max-width:480px; margin:0 auto; padding:0 16px 40px; }
      .topbar { display:grid; grid-template-columns:24px 1fr 24px; align-items:center; padding:16px 20px; background:#fff; margin:0 -16px 12px; border-bottom:1px solid var(--border); }
      .topbar .title { text-align:center; font-size:17px; font-weight:700; }
      .topbar svg { width:22px; height:22px; stroke:var(--dark); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; cursor:pointer; }
      .card { background:#fff; border-radius:14px; padding:20px; margin-bottom:14px; }
      .balance { background:#1a1a1a; color:#fff; border-radius:14px; padding:20px; text-align:center; margin-bottom:14px; }
      .balance .label { font-size:13px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; }
      .balance .amount { font-size:32px; font-weight:800; margin-top:6px; }
      .txn { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); }
      .txn:last-child { border-bottom:none; }
      .txn .left { display:flex; align-items:center; gap:12px; }
      .txn .icon { width:36px; height:36px; border-radius:50%; background:#f5f5f7; display:flex; align-items:center; justify-content:center; }
      .txn .icon svg { width:18px; height:18px; stroke:var(--gray); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .txn .meta .name { font-weight:600; font-size:14px; }
      .txn .meta .date { font-size:12px; color:var(--gray); margin-top:2px; }
      .txn .value { font-weight:700; color:var(--green); font-size:15px; }
      .section-title { font-weight:800; font-size:16px; margin-bottom:12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <svg viewBox="0 0 24 24" onclick="if(history.length>1)history.back();else location.href='/resgatar/'"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <div class="title">Transaction History</div>
        <span></span>
      </div>

      <div class="balance">
        <div class="label">Total Transactions</div>
        <div class="amount">$0.03</div>
      </div>

      <div class="card">
        <div class="section-title">Recent</div>
        <div class="txn">
          <div class="left">
            <div class="icon"><svg viewBox="0 0 24 24"><polyline points="20 12 4 12"/><polyline points="12 4 4 12 12 20"/></svg></div>
            <div class="meta"><div class="name">Creator reward</div><div class="date">Pending</div></div>
          </div>
          <div class="value">+$0.03</div>
        </div>
      </div>
    </div>
  </body>
</html>
