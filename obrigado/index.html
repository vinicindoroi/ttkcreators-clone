    <style>
      :root { --pink:#ff0050; --yellow:#f9fd5a; --green:#00b562; --dark:#1a1a1a; --gray:#666; }
      * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
      body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#fff; color:var(--dark); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
      .card { max-width:420px; width:100%; text-align:center; }
      .check { width:80px; height:80px; border-radius:50%; background:var(--green); margin:0 auto 20px; display:flex; align-items:center; justify-content:center; animation:pop .4s ease-out; }
      .check svg { width:40px; height:40px; stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.1)} 100%{transform:scale(1)} }
      h1 { font-size:26px; font-weight:800; margin-bottom:8px; }
      p { color:var(--gray); font-size:15px; line-height:1.5; margin-bottom:16px; }
      .amount-badge { background:linear-gradient(135deg,var(--yellow),#fff5a0); border:2px solid var(--yellow); border-radius:14px; padding:18px; margin:20px 0; }
      .amount-badge .label { font-size:11px; font-weight:700; text-transform:uppercase; color:var(--gray); letter-spacing:.5px; }
      .amount-badge .val { font-size:34px; font-weight:900; margin-top:4px; color:var(--dark); }
      .info { background:#f5f5f5; border-radius:10px; padding:14px; text-align:left; font-size:13px; color:var(--gray); margin-top:16px; }
      .info strong { color:var(--dark); }

    <div class="card">

      <p>Your withdrawal verification was successful. Your reward is being released to your account.</p>

      <div class="amount-badge">
        <div class="label">Reward Being Sent</div>
        <div class="val">$550.00</div>
      </div>

      <div class="info">
        <strong>What happens next:</strong><br />
        Your reward will arrive in your chosen payout account within <strong>24 hours</strong>. Check your email for confirmation and tracking details.
      </div>
    </div>
